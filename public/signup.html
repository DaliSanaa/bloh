<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up — Bloh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card auth-card-wide">
      <a href="/" class="logo-link auth-logo" aria-label="Bloh home">
        <span class="logo-wordmark">Bloh</span>
      </a>
      <h1>Create account</h1>
      <p class="auth-hint auth-clerk-hint">Continue with Google, Microsoft, GitHub, Apple, email, and more.</p>
      <div id="clerk-root" class="clerk-root"></div>
      <p id="auth-error" class="auth-error" role="alert"></p>
      <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
    </div>
  </main>
  <script defer src="/js/clerk-auth.js" data-mode="sign-up"></script>
</body>
</html>
